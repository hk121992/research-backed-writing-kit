  '\bprioritiz(e|es|ed|ing)\b': prioritis$1
  '\bcenter(s|ed|ing)?\b': centre$1
  '\bmeter(s)?\b': metre$1
  '\bbehavior(s|al|ally)?\b': behaviour$1
  '\bcolor(s|ed|ing|ful)?\b': colour$1
  '\blabor(s|ed|ing)?\b': labour$1
  '\bfavor(s|ed|ing|able|ably|ite)?\b': favour$1
  '\bhonor(s|ed|ing|able)?\b': honour$1
